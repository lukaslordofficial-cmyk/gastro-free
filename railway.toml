# Build from monorepo root (context = repo root).
# Do NOT set Railway Root Directory to "backend" when using this file —
# use root Dockerfile + requirements-prod.txt instead.
# Alternative: Root Directory = backend → backend/Dockerfile + backend/railway.toml
# https://docs.railway.app/guides/dockerfiles

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
